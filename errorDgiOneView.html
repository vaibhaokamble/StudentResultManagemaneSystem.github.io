<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Roll Number Not Found – RTMNU Nagpur</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .result-img {
      display: block;
      margin: 0 auto 16px;
      filter: drop-shadow(0 4px 12px rgba(0,0,0,0.4));
      animation: imgPop 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) both;
    }
    @keyframes imgPop {
      from { opacity: 0; transform: scale(0.7); }
      to   { opacity: 1; transform: scale(1);   }
    }
  </style>
</head>
<body>
  <!-- Animated floating circles -->
  <ul class="circles">
    <li></li><li></li><li></li><li></li><li></li>
    <li></li><li></li><li></li><li></li><li></li>
  </ul>

  <div class="login-box">
    <img src="result.png" width="140" height="105" class="result-img" alt="Result">
    <h1>Check Result</h1>
    <h3>⚠ Roll Number not found. Please try again.</h3>
    <form method="post" action="studentHome.jsp">
      <p>Roll Number</p>
      <input type="text" name="rollNo" placeholder="Enter Roll Number" required>
      <input type="submit" value="Search Again">
    </form>
    <center><h1><a href="index.html">← Back to Home</a></h1></center>
  </div>
</body>
</html>
